course:
  id: "IMG-05"
  title: "クオリティ改善と次のステップ"
  subtitle: "画像品質を上げるテクニックとFAQ"
  level: "実践"
  target: "マーケティング担当者・SNS運用者"
  duration: "10分"
  category: "AI画像生成"

chapters:
  - id: "IMG-05"
    title: "クオリティ改善と次のステップ"
    learning_goals:
      - "画像品質が上がらない3つの原因を特定できる"
      - "改善テンプレートを使って品質を向上できる"
      - "商用利用の注意点を理解している"

    slides:
      - type: "title"
        title: "クオリティ改善と次のステップ"
        subtitle: "AI画像生成 | P-05"

      - type: "cards"
        title: "うまくいかない主な原因"
        cards:
          - { icon: "warning", label: "内容が曖昧", desc: "「ビジネスの画像」では範囲が広すぎる", color: "red" }
          - { icon: "warning", label: "雰囲気が不明確", desc: "「いい感じ」ではAIに伝わらない", color: "amber" }
          - { icon: "warning", label: "構図が未指定", desc: "毎回ランダムな配置になる", color: "amber" }

      - type: "table"
        title: "① 曖昧な表現を避ける"
        headers: ["", "NG", "OK"]
        header_colors: ["offWhite", "red", "green"]
        rows:
          - ["例", "ビジネスの画像", "スーツを着た30代男性がオフィスでPCを操作"]
          - ["ポイント", "範囲が広すぎる", "「誰が」「何を」「どこで」を具体化"]

      - type: "table"
        title: "② 雰囲気を具体化する"
        headers: ["NG", "OK（雰囲気ワード）"]
        header_colors: ["red", "green"]
        rows:
          - ["いい感じ", "信頼感・プロフェッショナル"]
          - ["かっこいい", "高級感・プレミアム"]
          - ["優しい感じ", "ナチュラル・親しみやすい"]
          - ["先進的な", "未来感・テクノロジー"]
          - ["あったかい", "温かみ・アットホーム"]

      - type: "table"
        title: "③ 構図を指定する"
        headers: ["パターン", "指示例", "用途"]
        header_colors: ["accent", "offWhite", "offWhite"]
        rows:
          - ["中央配置", "中央にメイン被写体", "SNS投稿"]
          - ["左右分割", "左にテキスト、右に人物", "広告バナー"]
          - ["俯瞰", "上から見下ろすアングル", "商品・食べ物"]
          - ["クローズアップ", "商品や顔のアップ", "詳細訴求"]

      - type: "definition"
        title: "改善テンプレート"
        definition: "この順番で書くとAIに伝わりやすくなる"
        comparison:
          left: { label: "改善テンプレート", steps: ["誰が何をしているか", "場所・背景", "雰囲気（2〜3語）"] }
          right: { label: "改善テンプレート（続き）", steps: ["構図", "カラー", "サイズ"] }

      - type: "cards"
        title: "【実演】NG vs OK 比較"
        cards:
          - { icon: "exclamation", label: "NG", desc: "「ビジネスの画像を作って」", color: "red" }
          - { icon: "check", label: "OK", desc: "改善テンプレートで具体化した版", color: "green" }

      - type: "caution"
        title: "Q&A：商用利用について"
        items:
          - { icon: "check", title: "使用OK", desc: "汎用的なビジネス画像はそのまま商用利用可能", color: "green" }
          - { icon: "warning", title: "使用NG", desc: "実在の企業ロゴ・特定キャラクター・有名人に似た表現", color: "red" }

      - type: "cards"
        title: "修正の3ステップ"
        cards:
          - { icon: "pencil", label: "Step 1", desc: "誰が何をしているかを具体化する", color: "accent" }
          - { icon: "star", label: "Step 2", desc: "雰囲気（信頼感・高級感など）を追加する", color: "green" }
          - { icon: "desktop", label: "Step 3", desc: "構図（左右・中央など）を指定する", color: "amber" }

      - type: "cards"
        title: "次のステップ"
        cards:
          - { icon: "desktop", label: "今日", desc: "静止画でマーケティング素材を作った", color: "accent" }
          - { icon: "play", label: "次", desc: "同じスキルで動画を作る → AI動画生成（Veo3）", color: "green" }

      - type: "summary"
        title: "講座全体のまとめ"
        items:
          - { label: "P-01", text: "AI画像生成の利点とGeminiの使い方", color: "accent" }
          - { label: "P-02", text: "最初の1枚を作る基本操作", color: "green" }
          - { label: "P-03", text: "SNS素材をテンプレートで量産", color: "amber" }
          - { label: "P-04", text: "広告バナーをテンプレートで制作", color: "accent" }
          - { label: "P-05", text: "クオリティ改善と次のステップ", color: "green" }

      - type: "end"
        test_count: 5
        pass_rate: 80
        next: "AI動画生成（Veo3）講座"

    test:
      pass_rate: 80
      questions:
        - question: "クオリティが上がらない3つの原因の正しい組み合わせは？"
          choices:
            - "A. 解像度が低い・カラーが単調・サイズが不適切"
            - "B. 内容が曖昧・雰囲気が不明確・構図が未指定"
            - "C. ツールが古い・プランが無料・英語で指示していない"
            - "D. テーマが一般的・ターゲットが広い・カラーが暗い"
          answer: "B"
          explanation: "3つの原因は「内容が曖昧」「雰囲気が不明確」「構図が未指定」です。"

        - question: "「ビジネスの画像」を改善する表現として正しいものは？"
          choices:
            - "A. かっこいいビジネスの画像"
            - "B. スーツを着た30代男性がオフィスでPCを操作している"
            - "C. ビジネスっぽい雰囲気の画像"
            - "D. 仕事の画像を高品質で"
          answer: "B"
          explanation: "「誰が」「何を」「どこで」を具体化します。"

        - question: "修正する正しい順番は？"
          choices:
            - "A. 構図 → 雰囲気 → 内容の具体化"
            - "B. カラー → サイズ → テーマ変更"
            - "C. 内容の具体化 → 雰囲気の追加 → 構図の指定"
            - "D. サイズ変更 → 再生成 → テンプレ変更"
          answer: "C"
          explanation: "①内容具体化 ②雰囲気追加 ③構図指定の順です。"

        - question: "使用を避けるべき画像はどれ？"
          choices:
            - "A. 汎用的なビジネス画像"
            - "B. SNS投稿用の風景画像"
            - "C. 実在の企業ロゴが含まれる画像"
            - "D. 広告バナー用のイメージ画像"
          answer: "C"
          explanation: "実在の企業ロゴ、特定キャラクター、有名人に似た表現は使用NGです。"

        - question: "次のステップとして推奨される講座は？"
          choices:
            - "A. AIプレゼン資料作成"
            - "B. AI動画生成（Veo3）"
            - "C. Perplexityリサーチ活用"
            - "D. Claude Code実践"
          answer: "B"
          explanation: "静止画→動画への自然なステップアップとして「AI動画生成」が推奨です。"

    narrations:
      1: "最終パート、パート5に入ります。ここでは画像のクオリティを上げる方法、よくある質問への回答、そしてこの講座の次のステップをお伝えします。"
      2: "AI画像生成でうまくいかない時、原因はほとんどこの3つです。1つ目、内容が曖昧。2つ目、雰囲気が不明確。3つ目、構図が指定されていない。逆に言えば、この3つを潰せば、ほぼ確実にクオリティが上がります。"
      3: "1つ目の改善、曖昧な表現を避ける。NG例は「ビジネスの画像」。OK例は「スーツを着た30代男性がオフィスでPCを操作している」。「誰が」「何を」「どこで」の3つを具体化するだけで、格段に精度が上がります。"
      4: "2つ目の改善、雰囲気を具体化する。NG例は「いい感じ」。OK例は「信頼感・高級感・落ち着いた雰囲気」。よく使う雰囲気ワードをまとめました。この中から自分のブランドに合うものを選ぶだけで安定します。"
      5: "3つ目の改善、構図を指定する。よく使う構図パターンは4つ。中央配置、左右分割、俯瞰、クローズアップ。この4パターンを覚えておけば、ほとんどの場面に対応できます。"
      6: "クオリティが上がらない時はこの改善テンプレートを使ってください。「誰が何をしているか」を最初に書く。次に「場所・背景」。その後「雰囲気」を2〜3語で。そして「構図」「カラー」「サイズ」。この順番で書くと、情報が整理されてAIに伝わりやすくなります。"
      7: "実際に比較してみましょう。まず曖昧なプロンプトで生成。次に改善テンプレートを使って具体化した版で生成。プロンプトの書き方でここまで変わります。"
      8: "よくある質問にお答えします。生成した画像の商用利用について。汎用的なビジネス画像はそのまま使用OKです。ただし実在の企業ロゴ、特定のキャラクター、有名人に似た表現は使用を避けてください。"
      9: "思った通りの画像が出ない時の修正手順です。まず「誰が何をしているか」を具体化。次に「雰囲気」を追加。最後に「構図」を指定。この順番で安定して改善できます。"
      10: "次のステップをお伝えします。今日は「静止画」でマーケティング素材を作りました。この講座で身につけたプロンプトスキルは、そのまま動画にも応用できます。次の講座「AI動画生成」では、Veo3を使ってSNS用の動画を作ります。"
      11: "5パート全体を振り返りましょう。パート1でAI画像生成の利点とGeminiの使い方を学びました。パート2で最初の1枚を作りました。パート3でSNS素材をテンプレートで量産。パート4で広告バナー制作。パート5でクオリティ改善をマスター。画像生成は「文章でデザインを作る作業」です。今日からぜひ業務に取り入れてみてください。"
      12: "お疲れさまでした。これで全5パートの講座は終了です。最後の確認テストに挑戦してください。テストに合格したら、次の「AI動画生成」講座に進みましょう。"
