course:
  id: "IMG-01"
  title: "なぜAI画像生成なのか"
  subtitle: "AI画像生成でマーケティング素材を量産する"
  level: "実践"
  target: "マーケティング担当者・SNS運用者"
  duration: "10分"
  category: "AI画像生成"

chapters:
  - id: "IMG-01"
    title: "なぜAI画像生成なのか"
    learning_goals:
      - "AI画像生成のメリット（時間・コスト・スキル）を説明できる"
      - "Geminiの画像生成機能の特徴を理解している"
      - "この講座で作る素材の種類（SNS画像・広告バナー）がわかる"

    slides:
      - type: "title"
        title: "AI画像生成でマーケティング素材を量産する"
        subtitle: "Stage 5B | AI画像生成 P-01"

      - type: "goals"
        title: "この講座が終わったら、あなたは..."
        items:
          - "SNS投稿用の画像を自分で作れるようになる"
          - "広告バナーを自分で作れるようになる"
          - "「どう指示すればいいか」がわかる"

      - type: "table"
        title: "今日のアジェンダ"
        headers: ["パート", "テーマ", "時間"]
        header_colors: ["accent", "offWhite", "offWhite"]
        rows:
          - ["P-01", "なぜAI画像生成なのか（現在）", "10分"]
          - ["P-02", "まず1枚作る", "10分"]
          - ["P-03", "SNS素材テンプレート実践", "15分"]
          - ["P-04", "広告バナー制作", "12分"]
          - ["P-05", "クオリティ改善と次のステップ", "10分"]

      - type: "cards"
        title: "マーケティング素材、こうなってませんか？"
        cards:
          - { icon: "clock", label: "デザイナー待ち", desc: "依頼→確認→修正→納品で1週間", color: "red" }
          - { icon: "cart", label: "外注コスト", desc: "バナー1枚5,000円〜、月10枚で5万円", color: "amber" }
          - { icon: "users", label: "テンプレ頼み", desc: "Canvaのテンプレで他社と被る", color: "amber" }

      - type: "table"
        title: "AI画像生成なら"
        headers: ["項目", "従来", "AI画像生成"]
        header_colors: ["offWhite", "red", "green"]
        rows:
          - ["制作時間", "数日〜1週間", "数分"]
          - ["コスト", "1枚5,000円〜", "実質0円（既存プラン内）"]
          - ["スキル", "Photoshop等の専門知識", "日本語で指示するだけ"]
          - ["バリエーション", "追加料金", "何パターンでも生成可能"]

      - type: "cards"
        title: "今回使用するツール：Gemini"
        cards:
          - { icon: "globe", label: "日本語対応", desc: "日本語でそのまま指示できる", color: "accent" }
          - { icon: "bolt", label: "設定不要", desc: "複雑な設定が不要", color: "green" }
          - { icon: "play", label: "即座に生成", desc: "入力後すぐに画像が生成される", color: "amber" }

      - type: "definition"
        title: "Geminiの画像生成機能"
        definition: "Geminiのチャット画面から「画像を作って」と書くだけで起動"
        comparison:
          left: { label: "ポイント", steps: ["チャット画面からそのまま使える", "特別な設定やモード切替は不要", "無料プランでも利用可能"] }
          right: { label: "他のツール", steps: ["Midjourney: 英語必須・Discord操作", "DALL-E: OpenAIアカウント必要", "Stable Diffusion: 環境構築が複雑"] }

      - type: "cards"
        title: "この講座で作るもの"
        cards:
          - { icon: "desktop", label: "SNS投稿画像", desc: "Instagram / X / Facebook 用", color: "accent" }
          - { icon: "target", label: "広告バナー", desc: "Facebook広告 / Google広告 用", color: "green" }

      - type: "summary"
        title: "まとめ"
        items:
          - { label: "メリット", text: "時間・コスト・スキルの壁をまとめて解消", color: "accent" }
          - { label: "ツール", text: "Geminiなら日本語で指示するだけ。設定不要", color: "green" }
          - { label: "ゴール", text: "SNS画像と広告バナーの2つをマスターする", color: "amber" }

      - type: "end"
        test_count: 5
        pass_rate: 80
        next: "P-02 まず1枚作る"

    test:
      pass_rate: 80
      questions:
        - question: "従来のマーケティング素材制作の課題として、講義で挙げられていないものはどれですか？"
          choices:
            - "A. デザイナー待ちで1週間かかる"
            - "B. 外注コストが月5万円以上"
            - "C. AIが生成した画像の著作権問題"
            - "D. Canvaのテンプレが他社と被る"
          answer: "C"
          explanation: "講義で挙げた課題は「デザイナー待ち」「外注コスト」「テンプレ頼み」の3つ。著作権はこの文脈では挙げていません。"

        - question: "この講座でGeminiを使う理由として、正しくないものはどれですか？"
          choices:
            - "A. 日本語でそのまま指示できる"
            - "B. 複雑な設定が不要"
            - "C. 画像の解像度が他ツールより高い"
            - "D. 入力後すぐに画像が生成される"
          answer: "C"
          explanation: "Geminiを選ぶ理由は「日本語対応」「設定不要」「すぐ生成」の3点です。"

        - question: "AI画像生成を使った場合の制作時間の変化として正しいものは？"
          choices:
            - "A. 数日 → 数時間"
            - "B. 数日〜1週間 → 数分"
            - "C. 1週間 → 1日"
            - "D. 1ヶ月 → 1週間"
          answer: "B"
          explanation: "従来は数日から1週間かかっていた素材制作が、AI画像生成なら数分で完了します。"

        - question: "この講座で制作する素材は何ですか？"
          choices:
            - "A. SNS投稿画像とプレゼン資料"
            - "B. SNS投稿画像と広告バナー"
            - "C. 広告バナーとロゴデザイン"
            - "D. プレゼン資料とチラシ"
          answer: "B"
          explanation: "SNS投稿画像と広告バナーの2種類を制作します。"

        - question: "Geminiの画像生成機能について正しい説明はどれですか？"
          choices:
            - "A. 英語でプロンプトを書く必要がある"
            - "B. 有料プランでのみ利用可能"
            - "C. チャット画面から「画像を作って」と書くだけで起動する"
            - "D. 事前にモード切替が必要"
          answer: "C"
          explanation: "Geminiの画像生成はチャット画面から直接利用でき、特別な設定は不要です。"

    narrations:
      1: "こんにちは。AI画像生成コースへようこそ。この講座では、AIを使ってSNS投稿画像や広告バナーを自分で作れるようになる方法を、ゼロからお伝えしていきます。デザインの経験がない方でも大丈夫です。今のAIツールを使えば、プロンプトを書くだけで、プロに頼まなくても素材を回せる時代になりました。全5パート構成の第1回、まずは「なぜAI画像生成なのか」から始めましょう。"
      2: "この講座が終わったら、あなたにはこの3つの力が身についています。1つ目、SNS投稿用の画像を自分で作れるようになります。2つ目、広告バナーも自分で作れるようになります。3つ目、そして一番大事なのが「どう指示すればいいか」がわかること。つまり、デザイナーに頼まなくても、自分の力で素材を回せる状態を目指します。"
      3: "全体の構成をお見せします。この講座は全5パートで構成されています。今いるのはパート1、「なぜAI画像生成なのか」です。約10分で、AI画像生成を使う理由とツールの紹介をします。パート2では実際に1枚画像を作ります。パート3ではSNS素材のテンプレートを使った実践。パート4で広告バナーの制作。そしてパート5でクオリティの上げ方と、次のステップをお伝えします。ハンズオン中心の講座なので、一緒に手を動かしながら進めていきましょう。"
      4: "マーケティングの現場で、こんな状況になっていませんか。まずデザイナー待ち。依頼を出して、確認して、修正して、納品まで1週間。SNSは毎日投稿したいのに、素材が追いつかない。次に外注コスト。バナー1枚5,000円、月に10枚作ったら5万円。年間60万円です。そしてテンプレ頼み。Canvaのテンプレートをそのまま使うと、他社と同じデザインになってしまう。この3つの課題を、AI画像生成は一気に解決します。"
      5: "AI画像生成を使うと、状況が一変します。制作時間は数日から数分に。コストは1枚5,000円だったのが、実質0円。すでにGeminiを使っている方なら、追加料金なしで画像生成ができます。必要なスキルはPhotoshopの知識ではなく、日本語で指示を書くこと。しかもバリエーションは何パターンでも作れます。3パターン作って一番いいのを選ぶ、ということが当たり前にできるようになります。"
      6: "この講座ではGeminiの画像生成機能を使います。なぜGeminiなのか。3つの理由があります。1つ目、日本語でそのまま指示できる。英語に翻訳する必要がありません。2つ目、複雑な設定が不要。画面を開いて、テキストを入力するだけ。3つ目、入力後すぐに画像が生成される。待ち時間はほぼありません。他にもMidjourney、DALL-E、Stable Diffusionといったツールがありますが、業務で使うなら手軽さが最優先。Geminiはそのバランスが一番いいツールです。"
      7: "具体的にはGeminiに内蔵されている画像生成機能を使います。Geminiのチャット画面を開いて、「画像を作ってください」と書くだけで起動します。特別な設定やモード切替は不要です。無料プランでも利用可能ですので、今日この講座を見終わったらすぐに試せます。"
      8: "この講座で実際に作るものは2種類です。1つ目がSNS投稿画像。Instagram、X、Facebookに投稿する画像を、テンプレートを使って量産します。2つ目が広告バナー。Facebook広告やGoogle広告に使えるバナーを制作します。どちらもプロンプト、つまりテキストの指示だけで作ります。デザインソフトは一切使いません。"
      9: "パート1のまとめです。3つのポイントを振り返りましょう。1つ目。AI画像生成を使えば、マーケティング素材の制作にかかる時間・コスト・スキルの壁をまとめて解消できます。2つ目。Geminiなら日本語で指示するだけ。複雑な設定は一切不要で、すぐに使い始められます。3つ目。この講座ではSNS投稿画像と広告バナーの2つを、テンプレートを使ってマスターします。さあ、次のパート2では実際にGeminiを開いて、最初の1枚を作ってみましょう。"
      10: "お疲れさまでした。パート1「なぜAI画像生成なのか」はこれで終了です。ここまでの内容を確認するために、5問の確認テストに挑戦してください。80%以上、つまり4問以上の正解で合格です。テストが終わったら、パート2「まず1枚作る」に進みましょう。では、テストに進んでください。"
