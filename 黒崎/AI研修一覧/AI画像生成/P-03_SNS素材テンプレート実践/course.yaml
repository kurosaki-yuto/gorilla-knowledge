course:
  id: "IMG-03"
  title: "SNS素材テンプレート実践"
  subtitle: "テンプレートでSNS画像を量産する"
  level: "実践"
  target: "マーケティング担当者・SNS運用者"
  duration: "15分"
  category: "AI画像生成"

chapters:
  - id: "IMG-03"
    title: "SNS素材テンプレート実践"
    learning_goals:
      - "SNS素材テンプレート（6項目）を使いこなせる"
      - "業種別にテンプレートを応用できる"
      - "素材を効率よく量産するコツがわかる"

    slides:
      - type: "title"
        title: "SNS素材テンプレート実践"
        subtitle: "AI画像生成 | P-03"

      - type: "cards"
        title: "なぜSNSから始めるか"
        cards:
          - { icon: "chart", label: "使用頻度が高い", desc: "毎日〜週数回投稿する", color: "accent" }
          - { icon: "check", label: "難易度が低い", desc: "正方形1枚でOK", color: "green" }
          - { icon: "star", label: "成果が出やすい", desc: "いいね・保存で効果が見える", color: "amber" }

      - type: "definition"
        title: "SNS素材テンプレート"
        definition: "6項目を埋めるだけで、安定した画像が毎回作れる"
        comparison:
          left: { label: "テンプレート項目", steps: ["テーマ", "ターゲット", "雰囲気"] }
          right: { label: "テンプレート項目（続き）", steps: ["カラー", "構図", "サイズ"] }

      - type: "definition"
        title: "活用例①: ビジネス系投稿"
        definition: "リモートワーク効率化のコツ"
        comparison:
          left: { label: "内容設定", steps: ["テーマ: リモートワーク効率化", "ターゲット: 30代IT企業社員", "雰囲気: スマートで清潔感"] }
          right: { label: "ビジュアル設定", steps: ["カラー: ネイビーとライトグレー", "構図: 左にPC、右に観葉植物", "サイズ: 正方形"] }

      - type: "cards"
        title: "【実演】ビジネス系画像を生成する"
        cards:
          - { icon: "pencil", label: "テンプレ入力", desc: "6項目を埋めて送信", color: "accent" }
          - { icon: "eye", label: "結果確認", desc: "生成された画像を確認", color: "green" }

      - type: "definition"
        title: "活用例②: 美容・ライフスタイル系"
        definition: "朝のスキンケアルーティン"
        comparison:
          left: { label: "内容設定", steps: ["テーマ: スキンケアルーティン", "ターゲット: 20代女性", "雰囲気: ナチュラルで柔らかい"] }
          right: { label: "ビジュアル設定", steps: ["カラー: ピンクベージュと白", "構図: 中央に商品、大理石背景", "サイズ: 正方形"] }

      - type: "definition"
        title: "活用例③: 飲食系"
        definition: "週末限定ランチメニュー"
        comparison:
          left: { label: "内容設定", steps: ["テーマ: 週末限定ランチ", "ターゲット: 30〜40代ファミリー", "雰囲気: 温かみのある美味しそうな"] }
          right: { label: "ビジュアル設定", steps: ["カラー: オレンジとブラウン", "構図: 俯瞰でテーブル全体", "サイズ: 正方形"] }

      - type: "table"
        title: "SNSプラットフォーム別サイズ"
        headers: ["プラットフォーム", "推奨サイズ", "指示方法"]
        header_colors: ["accent", "offWhite", "offWhite"]
        rows:
          - ["Instagram投稿", "1080×1080", "正方形"]
          - ["Instagramストーリー", "1080×1920", "縦長（9:16）"]
          - ["X（Twitter）", "1200×675", "横長（16:9）"]
          - ["Facebookフィード", "1200×630", "横長"]

      - type: "cards"
        title: "量産のコツ"
        cards:
          - { icon: "sync", label: "テーマだけ差し替え", desc: "カラー・雰囲気はシリーズで統一", color: "accent" }
          - { icon: "layer", label: "3パターン生成", desc: "1テーマで3つ作ってベストを選ぶ", color: "green" }
          - { icon: "clipboard", label: "プロンプト保存", desc: "気に入ったものはメモ帳に保存", color: "amber" }

      - type: "summary"
        title: "まとめ"
        items:
          - { label: "テンプレ", text: "6項目を埋めるだけで安定して作れる", color: "accent" }
          - { label: "汎用性", text: "業種を問わず同じテンプレートが使える", color: "green" }
          - { label: "量産", text: "テーマだけ差し替えれば量産できる", color: "amber" }

      - type: "end"
        test_count: 5
        pass_rate: 80
        next: "P-04 広告バナー制作"

    test:
      pass_rate: 80
      questions:
        - question: "SNSから始める理由として挙げられていないものは？"
          choices:
            - "A. 使用頻度が高い"
            - "B. 難易度が低い"
            - "C. 無料で始められる"
            - "D. 成果が出やすい"
          answer: "C"
          explanation: "理由は「使用頻度が高い」「難易度が低い」「成果が出やすい」の3つです。"

        - question: "テンプレートの6項目の正しい組み合わせは？"
          choices:
            - "A. テーマ・ターゲット・雰囲気・カラー・構図・サイズ"
            - "B. テーマ・ターゲット・雰囲気・フォント・構図・サイズ"
            - "C. テーマ・ターゲット・カラー・解像度・構図・サイズ"
            - "D. テーマ・雰囲気・カラー・構図・サイズ・フィルター"
          answer: "A"
          explanation: "6項目は「テーマ・ターゲット・雰囲気・カラー・構図・サイズ」です。"

        - question: "Instagram投稿の推奨サイズ指示方法は？"
          choices:
            - "A. 縦長（9:16）"
            - "B. 正方形"
            - "C. 横長（16:9）"
            - "D. A4サイズ"
          answer: "B"
          explanation: "Instagram投稿は正方形（1080×1080）が推奨です。"

        - question: "量産のコツとして挙げられていないものは？"
          choices:
            - "A. テーマだけ差し替える"
            - "B. 3パターン生成してベスト選択"
            - "C. 毎回新しいプロンプトをゼロから書く"
            - "D. プロンプトを保存して再利用"
          answer: "C"
          explanation: "テンプレート活用が推奨で、毎回ゼロからは非効率です。"

        - question: "ブランドイメージを保つためにシリーズで統一すべき要素は？"
          choices:
            - "A. テーマとターゲット"
            - "B. カラーと雰囲気"
            - "C. 構図とサイズ"
            - "D. テーマとサイズ"
          answer: "B"
          explanation: "カラーと雰囲気を統一し、テーマだけ差し替えます。"

    narrations:
      1: "パート3に入ります。ここからはSNS投稿用の画像を、テンプレートを使って量産していきます。パート2で学んだ5つの要素を、テンプレートに落とし込むことで、毎回ゼロから考える必要がなくなります。"
      2: "なぜSNS素材から始めるのか。理由は3つです。1つ目、使用頻度が高い。SNSは毎日、少なくとも週に数回投稿するもの。使う場面が一番多い素材です。2つ目、難易度が低い。正方形の画像1枚作ればいい。3つ目、成果が出やすい。投稿すればすぐに「いいね」や「保存」でフィードバックが返ってくる。"
      3: "これがSNS素材のテンプレートです。パート2で学んだ5要素に「サイズ」を加えた6項目。テーマ、ターゲット、雰囲気、カラー、構図、サイズ。この6つを埋めるだけで、安定した画像が毎回作れます。"
      4: "テンプレートに具体的な内容を入れてみましょう。ビジネス系の投稿を作ります。テーマは「リモートワーク効率化のコツ」。ターゲットは「30代のIT企業社員」。雰囲気は「スマートで清潔感のある」。カラーは「ネイビーとライトグレー」。構図は「左にノートPC、右に観葉植物がある明るいデスク」。サイズは「正方形」。これをGeminiに入力するだけです。"
      5: "実際にこのプロンプトでGeminiに画像を生成させてみましょう。テンプレートを入力して、送信します。このように、テンプレートに沿って入力するだけで、SNS投稿に使える画像ができあがります。"
      6: "業種を変えてみましょう。美容・ライフスタイル系の投稿です。テーマは「朝のスキンケアルーティン」。ターゲットは「20代女性」。雰囲気は「ナチュラルで柔らかい」。カラーは「ピンクベージュと白」。テンプレートは同じ。中身を変えるだけで、全く違うジャンルの画像が作れます。"
      7: "もう1つ、飲食系です。テーマは「週末限定ランチメニュー」。ターゲットは「近隣に住む30〜40代のファミリー」。雰囲気は「温かみのある、美味しそうな」。カラーは「暖色系のオレンジとブラウン」。どんな業種でもテンプレートに当てはめるだけで画像が作れます。"
      8: "SNSのプラットフォームによって最適なサイズが異なります。Instagram投稿なら正方形。ストーリーなら縦長の9対16。Xなら横長の16対9。プロンプトでは「正方形」「縦長」「横長」と書くだけでOKです。"
      9: "SNS素材を効率よく量産するコツを3つお伝えします。1つ目、テンプレートをコピーして「テーマ」だけ差し替える。2つ目、1つのテーマで3パターン生成して、ベストを選ぶ。3つ目、気に入ったプロンプトはメモ帳やNotionに保存しておく。"
      10: "パート3のまとめです。1つ目。SNS素材は6項目テンプレートを埋めるだけで安定して作れます。2つ目。業種を問わず同じテンプレートが使えます。3つ目。テーマだけ差し替えれば量産可能。次のパート4では、広告バナーの制作に進みます。"
      11: "お疲れさまでした。パート3はこれで終了です。5問の確認テストに挑戦してください。80%以上で合格です。"
