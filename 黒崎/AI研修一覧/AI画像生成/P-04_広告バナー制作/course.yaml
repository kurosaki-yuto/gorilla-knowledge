course:
  id: "IMG-04"
  title: "広告バナー制作"
  subtitle: "テンプレートで広告バナーを制作する"
  level: "実践"
  target: "マーケティング担当者・広告運用者"
  duration: "12分"
  category: "AI画像生成"

chapters:
  - id: "IMG-04"
    title: "広告バナー制作"
    learning_goals:
      - "SNS素材と広告バナーの違いを理解している"
      - "広告バナーテンプレート（7項目）を使いこなせる"
      - "構図の3パターンを適切に使い分けられる"

    slides:
      - type: "title"
        title: "広告バナー制作"
        subtitle: "AI画像生成 | P-04"

      - type: "table"
        title: "SNS素材と広告バナーの違い"
        headers: ["項目", "SNS素材", "広告バナー"]
        header_colors: ["offWhite", "accent", "green"]
        rows:
          - ["目的", "認知・エンゲージメント", "クリック・コンバージョン"]
          - ["テキスト", "なし or 最小限", "キャッチコピー必須"]
          - ["構図", "自由", "テキスト配置を考慮"]
          - ["サイズ", "正方形が中心", "横長が中心（1200×628）"]

      - type: "definition"
        title: "広告バナーテンプレート"
        definition: "SNS素材の6項目 + キャッチコピー = 7項目"
        comparison:
          left: { label: "SNS素材から継承", steps: ["テーマ", "ターゲット", "雰囲気", "カラー"] }
          right: { label: "広告で追加", steps: ["キャッチコピー（NEW）", "構図（テキスト位置を考慮）", "サイズ（横長中心）"] }

      - type: "definition"
        title: "活用例①: BtoB広告バナー"
        definition: "業務効率化ツールの広告 — 「作業時間を50%削減」"
        comparison:
          left: { label: "内容設定", steps: ["テーマ: 業務効率化ツール", "コピー: 作業時間を50%削減", "ターゲット: 中小企業の経営者"] }
          right: { label: "ビジュアル設定", steps: ["雰囲気: 信頼感・プロフェッショナル", "構図: 左にテキスト、右に人物", "サイズ: 1200×628"] }

      - type: "cards"
        title: "【実演】BtoB広告バナーを生成する"
        cards:
          - { icon: "pencil", label: "テンプレ入力", desc: "7項目を埋めて送信", color: "accent" }
          - { icon: "eye", label: "結果確認", desc: "キャッチコピーと構図を確認", color: "green" }

      - type: "definition"
        title: "活用例②: BtoC広告バナー"
        definition: "オンラインヨガレッスン — 「初回無料体験」"
        comparison:
          left: { label: "内容設定", steps: ["テーマ: オンラインヨガ", "コピー: 初回無料体験", "ターゲット: 30代女性"] }
          right: { label: "ビジュアル設定", steps: ["雰囲気: リラックス・ナチュラル", "構図: 中央に人物、上部にテキスト", "カラー: パステルグリーン"] }

      - type: "cards"
        title: "構図指定のコツ — 3パターン"
        cards:
          - { icon: "desktop", label: "パターンA", desc: "左にテキスト、右に人物・商品（BtoB向け）", color: "accent" }
          - { icon: "users", label: "パターンB", desc: "中央に人物、上下にテキスト（インパクト重視）", color: "green" }
          - { icon: "layer", label: "パターンC", desc: "背景全体に画像、手前にテキスト帯（雰囲気重視）", color: "amber" }

      - type: "table"
        title: "広告プラットフォーム別推奨サイズ"
        headers: ["プラットフォーム", "サイズ", "指示方法"]
        header_colors: ["accent", "offWhite", "offWhite"]
        rows:
          - ["Facebook / Instagram広告", "1200×628", "横長（約2:1）"]
          - ["Googleディスプレイ広告", "1200×628", "横長（約2:1）"]
          - ["Googleレスポンシブ広告", "1200×1200", "正方形"]
          - ["バナー広告（横長）", "728×90", "横長バナー"]

      - type: "summary"
        title: "まとめ"
        items:
          - { label: "テンプレ", text: "SNS素材6項目 + キャッチコピー = 7項目", color: "accent" }
          - { label: "構図", text: "テキストを置く場所を先に決める", color: "green" }
          - { label: "汎用性", text: "BtoB・BtoCどちらも同じテンプレートで対応", color: "amber" }

      - type: "end"
        test_count: 5
        pass_rate: 80
        next: "P-05 クオリティ改善と次のステップ"

    test:
      pass_rate: 80
      questions:
        - question: "SNS素材と広告バナーの最大の違いは？"
          choices:
            - "A. 使用するツールが異なる"
            - "B. 広告バナーにはキャッチコピーが必須"
            - "C. 広告バナーは正方形のみ"
            - "D. SNS素材のほうが制作が難しい"
          answer: "B"
          explanation: "広告バナーにはキャッチコピーが必須です。"

        - question: "広告バナーテンプレートの項目数は？"
          choices:
            - "A. 6項目"
            - "B. 7項目（キャッチコピー追加）"
            - "C. 8項目"
            - "D. 5項目"
          answer: "B"
          explanation: "SNS素材6項目 + キャッチコピー = 7項目です。"

        - question: "構図を考える際、最初に決めるべきことは？"
          choices:
            - "A. 背景の色"
            - "B. 人物の位置"
            - "C. テキストを置く場所"
            - "D. 画像のサイズ"
          answer: "C"
          explanation: "テキストを置く場所を先に決めてから構図を考えます。"

        - question: "Facebook広告の推奨サイズは？"
          choices:
            - "A. 1080×1080"
            - "B. 1200×628"
            - "C. 728×90"
            - "D. 1920×1080"
          answer: "B"
          explanation: "Facebook広告は1200×628（横長）が推奨です。"

        - question: "講義で紹介された構図パターンとして正しくないものは？"
          choices:
            - "A. 左テキスト、右人物"
            - "B. 中央人物、上下テキスト"
            - "C. 上半分テキスト、下半分人物"
            - "D. 背景画像、手前テキスト帯"
          answer: "C"
          explanation: "3パターンは「左右分割」「中央＋上下テキスト」「背景＋テキスト帯」です。"

    narrations:
      1: "パート4に入ります。ここからは広告バナーを制作していきます。SNS素材と同じテンプレートの考え方を使いますが、広告バナーにはSNS素材にはない「キャッチコピー」と「構図の指定」が重要になります。"
      2: "まず、SNS素材と広告バナーの違いを整理します。目的が違います。SNS素材は認知やエンゲージメントが目的。広告バナーはクリックやコンバージョンを獲る必要があります。テキストも違います。SNS素材はテキストなしでもOKですが、広告バナーにはキャッチコピーが必須です。"
      3: "広告バナーのテンプレートです。SNS素材の6項目に「キャッチコピー」を追加した7項目です。キャッチコピーが入ることで、広告として成立する画像になります。"
      4: "実際に広告バナーを作ってみましょう。BtoB向けの広告です。テーマは「業務効率化ツールの広告」。キャッチコピーは「作業時間を50%削減」。構図で「左にテキスト」と指定しているのがポイントです。"
      5: "実際に生成してみましょう。テンプレートをGeminiに入力します。キャッチコピーが入ることで広告として成立する画像になっているのがわかります。"
      6: "もう1パターン、BtoC向けの広告も作ってみましょう。テーマは「オンラインヨガレッスンの広告」。キャッチコピーは「初回無料体験」。同じテンプレートでも、中身を変えるだけでBtoBにもBtoCにも対応できます。"
      7: "広告バナーの構図を指定するコツをお伝えします。よく使う3パターンがあります。パターンA、左にテキスト・右に人物。パターンB、中央に人物・上下にテキスト。パターンC、背景全体に画像・手前にテキスト帯。大事なのは、テキストを置く場所を先に決めてから構図を考えることです。"
      8: "広告プラットフォームごとの推奨サイズも押さえておきましょう。Facebook広告とInstagram広告は1200×628の横長。Googleディスプレイ広告も同じサイズで使えます。"
      9: "パート4のまとめです。1つ目。広告バナーはSNS素材のテンプレートに「キャッチコピー」を加えた7項目で作れます。2つ目。構図は「テキストを置く場所」を先に決める。3つ目。BtoB、BtoCどちらも同じテンプレートで対応可能です。"
      10: "お疲れさまでした。パート4はこれで終了です。5問の確認テストに挑戦してください。"
