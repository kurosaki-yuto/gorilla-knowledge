course:
  id: "IMG-02"
  title: "まず1枚作る"
  subtitle: "Geminiで最初の画像を生成する"
  level: "実践"
  target: "マーケティング担当者・SNS運用者"
  duration: "10分"
  category: "AI画像生成"

chapters:
  - id: "IMG-02"
    title: "まず1枚作る"
    learning_goals:
      - "Geminiで画像を生成する基本操作ができる"
      - "プロンプトの基本構造（5要素）がわかる"
      - "自分の業務用画像を1枚作れる"

    slides:
      - type: "title"
        title: "まず1枚作る"
        subtitle: "AI画像生成 | P-02"

      - type: "goals"
        title: "このパートが終わったら、あなたは..."
        items:
          - "Geminiで画像を生成する基本操作ができる"
          - "プロンプトの基本構造がわかる"
          - "自分の業務用画像を1枚作れる"

      - type: "cards"
        title: "準備"
        cards:
          - { icon: "globe", label: "Step 1", desc: "gemini.google.com を開く", color: "accent" }
          - { icon: "key", label: "Step 2", desc: "Googleアカウントでログイン", color: "green" }
          - { icon: "check", label: "Step 3", desc: "チャット画面が表示されればOK", color: "green" }

      - type: "definition"
        title: "最初の1枚を作ってみよう"
        definition: "仕事効率化をテーマにしたInstagram投稿用の画像を作成してください"
        comparison:
          left: { label: "プロンプト内容", steps: ["20代ビジネスマン向け", "未来感のある雰囲気", "青と白を基調"] }
          right: { label: "構図・サイズ", steps: ["中央に人物", "背景はデジタル表現", "正方形"] }

      - type: "cards"
        title: "【実演】画像を生成する"
        cards:
          - { icon: "pencil", label: "1. 入力", desc: "プロンプトを入力", color: "accent" }
          - { icon: "play", label: "2. 送信", desc: "送信ボタンを押す", color: "green" }
          - { icon: "eye", label: "3. 確認", desc: "生成結果を確認", color: "amber" }
          - { icon: "desktop", label: "4. 保存", desc: "画像をダウンロード", color: "accent" }

      - type: "cards"
        title: "プロンプトの基本構造（5要素）"
        cards:
          - { icon: "target", label: "テーマ", desc: "何を作りたいか", color: "accent" }
          - { icon: "users", label: "ターゲット", desc: "誰向けか", color: "green" }
          - { icon: "star", label: "雰囲気", desc: "どんな印象か", color: "amber" }
          - { icon: "layer", label: "カラー", desc: "何色を基調にするか", color: "accent" }
          - { icon: "desktop", label: "構図", desc: "どんな配置か", color: "green" }

      - type: "table"
        title: "要素を1つ変えるだけで印象が変わる"
        headers: ["カラー", "印象"]
        header_colors: ["accent", "offWhite"]
        rows:
          - ["青と白", "未来感・クリーン"]
          - ["オレンジと白", "活気・エネルギッシュ"]
          - ["黒と金", "高級感・プレミアム"]
          - ["緑と白", "ナチュラル・安心感"]

      - type: "caution"
        title: "画像生成は「文章でデザインを作る作業」"
        items:
          - { icon: "check", title: "操作スキル不要", desc: "PhotoshopやIllustratorの操作スキルは一切不要", color: "green" }
          - { icon: "pencil", title: "言語化が鍵", desc: "必要なのは「何を作りたいか」を言葉にする力", color: "accent" }
          - { icon: "bolt", title: "改善も簡単", desc: "うまくいかない時は、言葉をもっと具体的にするだけ", color: "amber" }

      - type: "summary"
        title: "まとめ"
        items:
          - { label: "操作", text: "Geminiを開いてテキストを入力するだけで画像が作れる", color: "accent" }
          - { label: "構造", text: "テーマ・ターゲット・雰囲気・カラー・構図の5要素", color: "green" }
          - { label: "本質", text: "画像生成は「文章でデザインを作る作業」", color: "amber" }

      - type: "end"
        test_count: 5
        pass_rate: 80
        next: "P-03 SNS素材テンプレート実践"

    test:
      pass_rate: 80
      questions:
        - question: "Geminiで画像を生成するために必要な準備はどれですか？"
          choices:
            - "A. 専用アプリをインストールする"
            - "B. gemini.google.comを開いてGoogleアカウントでログインする"
            - "C. 画像生成モードに切り替える設定をする"
            - "D. 有料プランに加入する"
          answer: "B"
          explanation: "gemini.google.comを開いてログインするだけです。"

        - question: "プロンプトの基本構造5要素の正しい組み合わせは？"
          choices:
            - "A. テーマ・ターゲット・雰囲気・カラー・構図"
            - "B. テーマ・サイズ・解像度・フォント・カラー"
            - "C. ターゲット・構図・フィルター・エフェクト・サイズ"
            - "D. テーマ・ターゲット・カラー・フォント・レイアウト"
          answer: "A"
          explanation: "5要素は「テーマ・ターゲット・雰囲気・カラー・構図」です。"

        - question: "デモで使用したプロンプトのテーマは？"
          choices:
            - "A. 新商品発売"
            - "B. 仕事効率化"
            - "C. チームビルディング"
            - "D. DX推進"
          answer: "B"
          explanation: "「仕事効率化をテーマにしたInstagram投稿用の画像」を生成しました。"

        - question: "カラーを黒と金にすると印象はどう変わる？"
          choices:
            - "A. 活気・エネルギッシュ"
            - "B. 未来感"
            - "C. 高級感・プレミアム"
            - "D. ナチュラル・親しみやすい"
          answer: "C"
          explanation: "黒と金は高級感・プレミアム感を演出します。"

        - question: "画像生成とは何か、講義での表現は？"
          choices:
            - "A. AIにデザインを任せる作業"
            - "B. 文章でデザインを作る作業"
            - "C. テンプレートをカスタマイズする作業"
            - "D. 写真を加工する作業"
          answer: "B"
          explanation: "画像生成は「文章でデザインを作る作業」です。"

    narrations:
      1: "パート2へようこそ。ここからはいよいよ手を動かしていきます。このパートでは、Geminiを使って最初の1枚を実際に作ります。難しいことは何もありません。画面を開いて、テキストを入力するだけです。一緒にやっていきましょう。"
      2: "このパートが終わったら、3つのことができるようになります。まず、Geminiで画像を生成する基本操作。次に、プロンプトの基本構造の理解。そして、自分の業務に使える画像を1枚、実際に作れる状態になります。"
      3: "では準備をしましょう。まず、gemini.google.comをブラウザで開いてください。Googleアカウントでログインすると、チャット画面が表示されます。これだけで準備完了です。特別なアプリのインストールや設定は必要ありません。"
      4: "では最初の1枚を作ります。このプロンプトをそのまま入力してみてください。「仕事効率化をテーマにしたInstagram投稿用の画像を作成してください。20代ビジネスマン向け、未来感のある雰囲気、青と白を基調。中央に人物、背景はデジタル表現、正方形」。これだけです。入力できたら、送信ボタンを押してください。"
      5: "実際にやってみましょう。Geminiの画面にプロンプトを入力します。送信すると、数秒で画像が生成されます。このように、テキストを入力するだけで画像ができあがりました。気に入った画像があれば、クリックしてダウンロードできます。"
      6: "今入力したプロンプトには、実は5つの要素が含まれています。1つ目がテーマ。「仕事効率化」です。2つ目がターゲット。「20代ビジネスマン向け」。3つ目が雰囲気。「未来感のある雰囲気」。4つ目がカラー。「青と白を基調」。5つ目が構図。「中央に人物、背景はデジタル表現」。この5つの要素を押さえれば、どんな画像でも安定して作れます。"
      7: "この5つの要素のうち、1つを変えるだけで印象がガラッと変わります。例えばカラー。青と白なら未来感。これをオレンジと白に変えると、活気やエネルギッシュな印象に。黒と金にすると、高級感やプレミアム感が出ます。同じテーマ、同じ構図でも、色を変えるだけで全く違う画像になる。これがAI画像生成の面白いところです。"
      8: "ここで大事なことをお伝えします。画像生成は「文章でデザインを作る作業」です。PhotoshopやIllustratorの操作スキルは一切要りません。必要なのは、「何を作りたいか」を言葉にする力だけ。もしうまくいかない時は、言葉をもっと具体的にすればいい。これだけです。このシンプルな考え方を、この後のパートでもずっと使っていきます。"
      9: "パート2のまとめです。1つ目。Geminiを開いてテキストを入力するだけで画像が作れる。特別なスキルは不要です。2つ目。プロンプトは「テーマ・ターゲット・雰囲気・カラー・構図」の5つの要素で構成する。3つ目。画像生成は「文章でデザインを作る作業」。これを覚えておいてください。次のパート3では、この基本を使ってSNS投稿用の素材をテンプレートで量産していきます。"
      10: "お疲れさまでした。パート2「まず1枚作る」はこれで終了です。5問の確認テストに挑戦してください。80%以上で合格です。テストが終わったら、パート3「SNS素材テンプレート実践」に進みましょう。"
